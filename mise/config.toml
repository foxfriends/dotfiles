[tools]
cargo-binstall = "latest"
"cargo:du-dust" = { version = "latest", lazy = true, lazy_bins = ["dust"] }
"cargo:eza" = "latest"
"cargo:fd-find" = { version = "latest", lazy = true, lazy_bins = ["fd"] }
"cargo:fend" = { version = "latest", lazy = true, lazy_bins = ["fend"] }
"cargo:git-delta" = "latest"
"cargo:https://github.com/foxfriends/trilogy" = { version = "branch:main", lazy = true, lazy_bins = ["trilogy"] }
"cargo:https://github.com/ms-jpq/sad" = { version = "branch:senpai", lazy = true, lazy_bins = ["sad"] }
"cargo:paper-terminal" = { version = "latest", lazy = true, lazy_bins = ["paper"] }
"cargo:pastel" = "latest"
"cargo:ripgrep" = "latest"
"cargo:syncat" = { version = "latest", lazy = true, lazy_bins = ["syncat"] }
"cargo:tealdeer" = { version = "latest", lazy = true, lazy_bins = ["tldr"] }
"cargo:zoxide" = "latest"
go = { version = "latest", lazy = true }
"go:github.com/pdfrg/must/cmd/must" = { version = "latest", lazy = true, lazy_bins = ["must"] }
just = "latest"
kubectl = { version = "latest", lazy = true }
node = "latest"
"npm:oxfmt" = { version = "latest", lazy = true, lazy_bins = ["oxfmt"] }
"npm:oxlint" = { version = "latest", lazy = true, lazy_bins = ["oxlint"] }
"npm:prettier" = { version = "latest", lazy = true, lazy_bins = ["prettier"] }
"npm:typescript" = { version = "latest", lazy = true, lazy_bins = ["tsc"] }
opentofu = { version = "latest", lazy = true }
python = { version = "latest", lazy = true }
rust = { version = "latest", profile = "default", components = ["rust-analyzer"] }
television = "latest"
terraform = { version = "latest", lazy = true }
typst = { version = "latest", lazy = true }
usage = "latest"
uv = { version = "latest", lazy = true }
yazi = "latest"

[settings]
experimental = true
locked = true
locked_scopes = ["global"]
idiomatic_version_file_enable_tools = ["node", "yarn", "python", "pnpm", "npm"]

[settings.cargo]
binstall_quickinstall = true
